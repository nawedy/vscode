<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Security Best Practices</title>
	<link rel="stylesheet" href="{{cssUri}}">
	<style>
		.security-practices {
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		.practices-header {
			padding: 15px;
			border-bottom: 1px solid var(--vscode-panel-border);
		}
		.practices-body {
			flex: 1;
			overflow: auto;
			padding: 15px;
		}
		.practices-summary {
			margin: 10px 0;
			padding: 15px;
			background-color: var(--vscode-editor-lineHighlightBackground);
			border-radius: 4px;
		}
		.practices-list {
			margin-top: 20px;
		}
		.practice-category {
			margin-bottom: 25px;
		}
		.category-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding-bottom: 8px;
			margin-bottom: 12px;
			border-bottom: 1px solid var(--vscode-panel-border);
		}
		.category-title {
			font-size: 1.2em;
			font-weight: bold;
		}
		.practice-item {
			margin-bottom: 15px;
			padding: 10px;
			background-color: var(--vscode-editor-background);
			border: 1px solid var(--vscode-panel-border);
			border-radius: 4px;
		}
		.practice-title {
			font-weight: bold;
			margin-bottom: 5px;
		}
		.practice-description {
			margin-bottom: 8px;
		}
		.practice-code {
			margin: 10px 0;
			padding: 10px;
			background-color: var(--vscode-textCodeBlock-background);
			border-radius: 4px;
			font-family: var(--vscode-editor-font-family);
			font-size: var(--vscode-editor-font-size);
			white-space: pre;
			overflow-x: auto;
		}
		.code-comparison {
			display: flex;
			gap: 15px;
			margin: 10px 0;
		}
		.code-panel {
			flex: 1;
		}
		.code-panel-header {
			padding: 5px 10px;
			background-color: var(--vscode-panel-background);
			border-top-left-radius: 4px;
			border-top-right-radius: 4px;
			font-size: 0.9em;
		}
		.code-panel-body {
			padding: 10px;
			background-color: var(--vscode-textCodeBlock-background);
			border-bottom-left-radius: 4px;
			border-bottom-right-radius: 4px;
			font-family: var(--vscode-editor-font-family);
			font-size: var(--vscode-editor-font-size);
			white-space: pre;
			overflow-x: auto;
		}
		.bad-practice {
			border-left: 4px solid #e51400;
		}
		.good-practice {
			border-left: 4px solid #3794ff;
		}
		.risk-level {
			font-size: 0.85em;
			padding: 3px 8px;
			border-radius: 10px;
			color: white;
		}
		.risk-high {
			background-color: #e51400;
		}
		.risk-medium {
			background-color: #ff8c00;
		}
		.risk-low {
			background-color: #3794ff;
		}
		.button-bar {
			display: flex;
			justify-content: flex-end;
			padding: 10px 15px;
			border-top: 1px solid var(--vscode-panel-border);
		}
		.button-bar button {
			margin-left: 10px;
		}
		.apply-changes-button {
			display: flex;
			justify-content: center;
			margin-top: 10px;
		}
		.search-container {
			margin-bottom: 15px;
		}
		.search-input {
			width: 100%;
			padding: 6px;
			background-color: var(--vscode-input-background);
			color: var(--vscode-input-foreground);
			border: 1px solid var(--vscode-input-border);
			border-radius: 4px;
		}
		.framework-filter {
			display: flex;
			gap: 10px;
			margin-bottom: 15px;
			flex-wrap: wrap;
		}
		.framework-tag {
			padding: 4px 8px;
			border-radius: 12px;
			background-color: var(--vscode-button-background);
			color: var(--vscode-button-foreground);
			cursor: pointer;
			font-size: 0.9em;
		}
		.framework-tag.active {
			background-color: var(--vscode-button-hoverBackground);
		}
		.toggle-details {
			background: none;
			border: none;
			color: var(--vscode-textLink-foreground);
			cursor: pointer;
			padding: 0;
			font-size: 0.9em;
			text-decoration: underline;
		}
		.details-hidden .practice-details {
			display: none;
		}
	</style>
</head>
<body>
	<div class="security-practices">
		<div class="practices-header">
			<h2>Security Best Practices for {{language}}</h2>
			<div class="practices-summary">
				<p>This guide provides security best practices for writing secure {{language}} code. Following these practices will help you prevent common security vulnerabilities and implement secure coding patterns.</p>
			</div>
			<div class="search-container">
				<input type="text" id="search-input" class="search-input" placeholder="Search best practices...">
			</div>
			<div class="framework-filter" id="framework-filter">
				<!-- Framework filters will be added here -->
			</div>
		</div>

		<div class="practices-body">
			<div class="practices-list" id="practices-list">
				<!-- Best practices will be inserted here -->
			</div>
		</div>

		<div class="button-bar">
			<button id="export-md-button">Export as Markdown</button>
			<button id="apply-all-button">Apply All Recommended Changes</button>
		</div>
	</div>

	<script type="application/json" id="practices-data">
		{{practicesJSON}}
	</script>

	<script nonce="{{nonce}}">
		// Initialize data
		let practices = [];
		let frameworks = [];
		let activeFrameworks = [];
		let searchTerm = '';

		try {
			const practicesData = document.getElementById('practices-data');
			if (practicesData) {
				practices = JSON.parse(practicesData.textContent);
			}
		} catch (e) {
			console.error('Failed to parse practices data:', e);
		}

		// Set initial state
		window.initialData = {
			practices,
			language: "{{language}}"
		};

		// Extract unique frameworks
		function extractFrameworks() {
			const uniqueFrameworks = new Set();

			practices.forEach(category => {
				category.practices.forEach(practice => {
					if (practice.frameworks && practice.frameworks.length) {
						practice.frameworks.forEach(framework => uniqueFrameworks.add(framework));
					}
				});
			});

			frameworks = Array.from(uniqueFrameworks).sort();
		}

		// Render framework filters
		function renderFrameworkFilters() {
			const container = document.getElementById('framework-filter');

			if (!frameworks.length) {
				container.style.display = 'none';
				return;
			}

			let html = '<span>Filter by framework: </span>';

			frameworks.forEach(framework => {
				const isActive = activeFrameworks.includes(framework);
				html += `
					<span class="framework-tag ${isActive ? 'active' : ''}" data-framework="${framework}">
						${framework}
					</span>`;
			});

			container.innerHTML = html;

			// Add event listeners to framework tags
			document.querySelectorAll('.framework-tag').forEach(tag => {
				tag.addEventListener('click', function() {
					const framework = this.dataset.framework;

					if (activeFrameworks.includes(framework)) {
						// Remove from active frameworks
						activeFrameworks = activeFrameworks.filter(f => f !== framework);
						this.classList.remove('active');
					} else {
						// Add to active frameworks
						activeFrameworks.push(framework);
						this.classList.add('active');
					}

					renderPractices();
				});
			});
		}

		// Render best practices
		function renderPractices() {
			const container = document.getElementById('practices-list');

			if (!practices || !practices.length) {
				container.innerHTML = '<p>No security best practices available.</p>';
				return;
			}

			let html = '';
			let visiblePracticesCount = 0;

			practices.forEach(category => {
				// Filter practices based on search term and active frameworks
				const filteredPractices = category.practices.filter(practice => {
					// Check if practice meets search criteria
					const matchesSearch = searchTerm === '' ||
						practice.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
						practice.description.toLowerCase().includes(searchTerm.toLowerCase());

					// Check if practice meets framework criteria
					const matchesFramework = activeFrameworks.length === 0 ||
						(practice.frameworks && practice.frameworks.some(f => activeFrameworks.includes(f)));

					return matchesSearch && matchesFramework;
				});

				if (filteredPractices.length === 0) {
					return; // Skip categories with no matching practices
				}

				visiblePracticesCount += filteredPractices.length;

				html += `
					<div class="practice-category">
						<div class="category-header">
							<div class="category-title">${category.category}</div>
						</div>
						<div class="category-practices">`;

				filteredPractices.forEach(practice => {
					// Determine risk level class
					const riskLevelClass = practice.riskLevel === 'High' ? 'risk-high' :
						practice.riskLevel === 'Medium' ? 'risk-medium' : 'risk-low';

					html += `
						<div class="practice-item details-hidden" data-id="${practice.id}">
							<div class="practice-header">
								<div class="practice-title">
									${practice.title}
									<span class="risk-level ${riskLevelClass}">${practice.riskLevel}</span>
								</div>
								<div class="practice-description">${practice.description}</div>
								<button class="toggle-details">Show Details</button>
							</div>
							<div class="practice-details">`;

					// Add code examples if available
					if (practice.badCode && practice.goodCode) {
						html += `
							<div class="code-comparison">
								<div class="code-panel">
									<div class="code-panel-header bad-practice">Vulnerable Code</div>
									<div class="code-panel-body">${escapeHtml(practice.badCode)}</div>
								</div>
								<div class="code-panel">
									<div class="code-panel-header good-practice">Secure Code</div>
									<div class="code-panel-body">${escapeHtml(practice.goodCode)}</div>
								</div>
							</div>`;
					} else if (practice.code) {
						html += `
							<div class="practice-code">${escapeHtml(practice.code)}</div>`;
					}

					// Add additional information
					if (practice.explanation) {
						html += `
							<div class="practice-explanation">${practice.explanation}</div>`;
					}

					// Add apply button if practice is applicable to current code
					if (practice.applicable) {
						html += `
							<div class="apply-changes-button">
								<button class="apply-practice-button" data-id="${practice.id}">Apply This Change</button>
							</div>`;
					}

					html += `
							</div>
						</div>`;
				});

				html += `
						</div>
					</div>`;
			});

			if (visiblePracticesCount === 0) {
				html = '<p>No matching security best practices found.</p>';
			}

			container.innerHTML = html;

			// Add event listeners to toggle detail buttons
			document.querySelectorAll('.toggle-details').forEach(button => {
				button.addEventListener('click', function() {
					const practiceItem = this.closest('.practice-item');
					practiceItem.classList.toggle('details-hidden');
					this.textContent = practiceItem.classList.contains('details-hidden') ?
						'Show Details' : 'Hide Details';
				});
			});

			// Add event listeners to apply buttons
			document.querySelectorAll('.apply-practice-button').forEach(button => {
				button.addEventListener('click', function() {
					const practiceId = this.dataset.id;
					applyPractice(practiceId);
				});
			});
		}

		// Apply a security practice change
		function applyPractice(practiceId) {
			const vscode = acquireVsCodeApi();
			vscode.postMessage({
				command: 'applyPractice',
				practiceId: practiceId
			});
		}

		// Apply all recommended changes
		function applyAllPractices() {
			const vscode = acquireVsCodeApi();
			const applicablePractices = practices.flatMap(category =>
				category.practices.filter(practice => practice.applicable)
			);

			vscode.postMessage({
				command: 'applyAllPractices',
				practiceIds: applicablePractices.map(p => p.id)
			});
		}

		// Export best practices as markdown
		function exportAsMarkdown() {
			const vscode = acquireVsCodeApi();
			vscode.postMessage({
				command: 'exportPractices',
				format: 'markdown'
			});
		}

		// Helper function to escape HTML
		function escapeHtml(unsafe) {
			return unsafe
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#039;");
		}

		// Initialize the view
		function initialize() {
			extractFrameworks();
			renderFrameworkFilters();
			renderPractices();
			setupEventListeners();
		}

		// Setup event listeners
		function setupEventListeners() {
			// Search input
			const searchInput = document.getElementById('search-input');
			if (searchInput) {
				searchInput.addEventListener('input', function() {
					searchTerm = this.value;
					renderPractices();
				});
			}

			// Export button
			const exportButton = document.getElementById('export-md-button');
			if (exportButton) {
				exportButton.addEventListener('click', exportAsMarkdown);
			}

			// Apply all button
			const applyAllButton = document.getElementById('apply-all-button');
			if (applyAllButton) {
				applyAllButton.addEventListener('click', applyAllPractices);
			}
		}

		// Initialize when DOM is loaded
		document.addEventListener('DOMContentLoaded', initialize);
	</script>
	<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
